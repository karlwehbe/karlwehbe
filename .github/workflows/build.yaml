name: README build
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Get Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: karlwehbe
        run: python today.py
      - name: Commit
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@karlwehbe.github.io"
          git config --global user.name "karlwehbe/GitHub-Actions-Bot"
          git commit -m "Updated README [skip ci]" -a || echo "No changes to commit"
          git pull --rebase "https://x-access-token:${ACCESS_TOKEN}@github.com/karlwehbe/karlwehbe.git" main || true
          git push "https://x-access-token:${ACCESS_TOKEN}@github.com/karlwehbe/karlwehbe.git" HEAD:main
